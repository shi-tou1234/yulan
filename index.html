<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown 预览器</title>

    <script>
        // 在首帧绘制前应用已保存的主题，避免暗色用户看到闪白
        (function () {
            try {
                var saved = localStorage.getItem('markdown-preview-theme');
                if (saved === 'dark' || saved === 'light') {
                    document.documentElement.setAttribute('data-theme', saved);
                }
            } catch (e) { /* localStorage 不可用时保持默认主题 */ }
        })();
    </script>

    <!-- Google Fonts（异步加载，避免 CDN 不可达时阻塞渲染；失败时回退系统字体栈） -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript>
        <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    </noscript>

    <!-- KaTeX CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css" integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV" crossorigin="anonymous">
    <!-- Highlight.js CSS（两套主题同时引入，切换时只改 disabled，避免换 URL 导致 SRI 失效） -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" integrity="sha384-eFTL69TLRZTkNfYZOLM+G04821K1qZao/4QLJbet1pP4tcF+fdXq/9CdqAbWRl/L" crossorigin="anonymous" id="hljs-theme-light">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" integrity="sha384-OLBgp1GsljhM2TJ+sbHjaiH9txEUvgdDTAzHv2P24donTt6/529l+9Ua0vFImLlb" crossorigin="anonymous" id="hljs-theme-dark" disabled>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- 顶部工具栏 -->
        <header class="toolbar">
            <div class="toolbar-left">
                <div class="logo">
                    <svg viewBox="0 0 24 24" width="22" height="22" class="logo-icon">
                        <path fill="currentColor" d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm4 18H6V4h7v5h5v11zM8 12h8v2H8v-2zm0 4h8v2H8v-2z"/>
                    </svg>
                    <span class="app-title">Markdown</span>
                    <span class="app-badge">Live Preview</span>
                </div>
            </div>

            <div class="toolbar-center">
                <div class="tool-group">
                    <button class="tool-btn" data-action="heading" title="标题">
                        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M3 4h2v6h4V4h2v14H9v-6H5v6H3V4m11 0h2v10h4V4h2v14h-2v-4h-6v4h-2V4z"/></svg>
                    </button>
                    <button class="tool-btn" data-action="bold" title="粗体">
                        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M13.5 15.5H10v-3h3.5c.83 0 1.5.67 1.5 1.5s-.67 1.5-1.5 1.5M10 6.5h3c.83 0 1.5.67 1.5 1.5S13.83 9.5 13 9.5h-3V6.5M15.5 11c1.38 0 2.5-1.12 2.5-2.5S16.88 6 15.5 6H8v12h7.5c1.66 0 3-1.34 3-3s-1.34-3-3-3H10v-1h5.5z"/></svg>
                    </button>
                    <button class="tool-btn" data-action="italic" title="斜体">
                        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M10 4v3h2.21l-3.42 8H6v3h8v-3h-2.21l3.42-8H18V4h-8z"/></svg>
                    </button>
                    <button class="tool-btn" data-action="strikethrough" title="删除线">
                        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M17.75 16.5c-.23.48-.57.9-1.02 1.23-.55.41-1.23.73-2.04.95-.81.22-1.74.33-2.79.33-1.38 0-2.55-.21-3.51-.62a5.04 5.04 0 0 1-2.24-1.92c-.51-.84-.77-1.86-.77-3.07H6.1c0 1.54.36 2.81 1.08 3.82.72 1 1.74 1.75 3.06 2.24 1.32.49 2.88.73 4.67.73 1.2 0 2.27-.13 3.21-.4.94-.27 1.73-.66 2.37-1.18.64-.52 1.11-1.15 1.41-1.9l-1.15-.45zM3 12.5h18v-1H3v1zm3.15-3.5c.22-.48.55-.9 1-1.23.54-.41 1.22-.73 2.03-.95.81-.22 1.74-.33 2.79-.33 1.38 0 2.55.21 3.51.62a5.04 5.04 0 0 1 2.24 1.92c.51.84.77 1.86.77 3.07h1.52c0-1.54-.36-2.81-1.08-3.82-.72-1-1.74-1.75-3.06-2.24-1.32-.49-2.88-.73-4.67-.73-1.2 0-2.27.13-3.21.4-.94.27-1.73.66-2.37 1.18-.64.52-1.11 1.15-1.41 1.9l1.15.45z"/></svg>
                    </button>
                    <div class="tool-separator"></div>
                    <button class="tool-btn" data-action="link" title="链接">
                        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1M8 13h8v-2H8v2m9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/></svg>
                    </button>
                    <button class="tool-btn" data-action="image" title="图片">
                        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
                    </button>
                    <button class="tool-btn" data-action="code" title="代码">
                        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/></svg>
                    </button>
                    <button class="tool-btn" data-action="quote" title="引用">
                        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M6 17h3l2-4V7H5v6h3zm8 0h3l2-4V7h-6v6h3z"/></svg>
                    </button>
                    <button class="tool-btn" data-action="list" title="无序列表">
                        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
                    </button>
                    <button class="tool-btn" data-action="ordered-list" title="有序列表">
                        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M2 17h2v.5H3v1h1v.5H2v1h3v-4H2v1zm1-9h1V4H2v1h1v3zm-1 3h1.8L2 13.1v.9h3v-1H3.2L5 10.9V10H2v1zm5-6v2h14V5H7zm0 14h14v-2H7v2zm0-6h14v-2H7v2z"/></svg>
                    </button>
                    <button class="tool-btn" data-action="task-list" title="任务列表">
                        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zM17.99 9l-1.41-1.42-6.59 6.59-2.58-2.57-1.42 1.41 4 3.99z"/></svg>
                    </button>
                    <button class="tool-btn" data-action="table" title="表格">
                        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M5 4h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2m0 4v4h6V8H5m8 0v4h6V8h-6m-8 6v4h6v-4H5m8 0v4h6v-4h-6z"/></svg>
                    </button>
                    <button class="tool-btn" data-action="formula" title="公式">
                        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M7 2h10v2H7V2M5 4h14v2H5V4M4 6h16v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6m4 2v10h2V8H8m4 0v10h2V8h-2m4 0v10h2V8h-2z"/></svg>
                    </button>
                    <button class="tool-btn" data-action="underline" title="下划线">
                        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M5 18h14v2H5v-2zm7-2a6 6 0 0 0 6-6V3h-2.5v7a3.5 3.5 0 0 1-7 0V3H6v7a6 6 0 0 0 6 6z"/></svg>
                    </button>
                    <button class="tool-btn" data-action="spoiler" title="模糊/剧透">
                        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M12 9a3 3 0 0 0-3 3a3 3 0 0 0 3 3a3 3 0 0 0 3-3a3 3 0 0 0-3-3m0 8.5c-4.5 0-8.3-3-9.7-7.2c1.4-4.2 5.2-7.2 9.7-7.2s8.3 3 9.7 7.2c-1.4 4.2-5.2 7.2-9.7 7.2M12 4.5C8.4 4.5 5.3 7 4 10.5c1.3 3.5 4.4 6 8 6s6.7-2.5 8-6c-1.3-3.5-4.4-6-8-6M2 12c1.5 4.7 5.6 8 10 8s8.5-3.3 10-8c-1.5-4.7-5.6-8-10-8s-8.5 3.3-10 8z"/></svg>
                    </button>
                    <button class="tool-btn" data-action="rainbow" title="彩虹文字">
                        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M12 2a10 10 0 0 0-10 10a10 10 0 0 0 10 10a10 10 0 0 0 10-10A10 10 0 0 0 12 2m0 2a8 8 0 0 1 8 8a8 8 0 0 1-8 8a8 8 0 0 1-8-8a8 8 0 0 1 8-8m0 2a6 6 0 0 0-6 6h2a4 4 0 0 1 4-4V6z"/></svg>
                    </button>
                    <button class="tool-btn" data-action="ruby" title="拼音注音">
                        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M5 4v3h5.5v12h3V7H19V4H5z"/></svg>
                    </button>
                    <button class="tool-btn" data-action="footnote" title="脚注">
                        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M19 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2m0 16H5V5h14v14M7 7h2v2H7V7m0 4h2v6H7v-6m4-4h6v2h-6V7m0 4h6v2h-6v-2m0 4h6v2h-6v-2z"/></svg>
                    </button>
                    <div class="tool-separator"></div>
                    <button class="tool-btn" data-action="quote-card" title="引用卡片">
                        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M6 17h3l2-4V7H5v6h3l-2 4zm8 0h3l2-4V7h-6v6h3l-2 4z"/></svg>
                    </button>
                    <button class="tool-btn" data-action="admonition" title="提示框">
                        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M13 9h-2V7h2m0 10h-2v-6h2m-1-9A10 10 0 0 0 2 12a10 10 0 0 0 10 10a10 10 0 0 0 10-10A10 10 0 0 0 12 2z"/></svg>
                    </button>
                    <button class="tool-btn" data-action="derivation" title="公式推导">
                        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83l3.75 3.75l1.83-1.83z"/></svg>
                    </button>
                    <button class="tool-btn" data-action="github-card" title="GitHub卡片">
                        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
                    </button>
                    <button class="tool-btn" data-action="music-card" title="音乐卡片">
                        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
                    </button>
                    <button class="tool-btn" data-action="figure" title="图片说明">
                        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
                    </button>
                    <div class="tool-separator"></div>
                    <button class="tool-btn" data-action="horizontal-rule" title="水平线">
                        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M19 13H5v-2h14v2z"/></svg>
                    </button>
                </div>
            </div>

            <div class="toolbar-right">
                <button class="tool-btn" id="theme-toggle" title="切换主题">
                    <svg viewBox="0 0 24 24" width="16" height="16" id="theme-icon"><path fill="currentColor" d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-3.03 0-5.5-2.47-5.5-5.5 0-1.82.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/></svg>
                </button>
                <button class="tool-btn" id="load-example" title="加载示例">
                    <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
                </button>
                <button class="tool-btn" id="export-md" title="导出 Markdown">
                    <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                </button>
                <button class="tool-btn" id="clear" title="清空">
                    <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                </button>
            </div>
        </header>

        <!-- 主体区域 -->
        <main class="main-content">
            <!-- 编辑区 -->
            <div class="editor-pane">
                <div class="pane-header">
                    <div class="pane-title-wrapper">
                        <svg viewBox="0 0 24 24" width="14" height="14" class="pane-icon"><path fill="currentColor" d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm4 18H6V4h7v5h5v11z"/></svg>
                        <span class="pane-title">编辑</span>
                        <span class="pane-meta">选区联动</span>
                    </div>
                    <div class="pane-header-right">
                        <span class="pane-meta">支持双向定位</span>
                        <span class="word-count" id="word-count">0 字</span>
                    </div>
                </div>
                <div class="editor-wrapper">
                    <textarea id="editor" class="editor" placeholder="在此输入 Markdown 代码..."></textarea>
                </div>
            </div>

            <!-- 预览区 -->
            <div class="preview-pane">
                <div class="pane-header">
                    <div class="pane-title-wrapper">
                        <svg viewBox="0 0 24 24" width="14" height="14" class="pane-icon"><path fill="currentColor" d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                        <span class="pane-title">预览</span>
                        <span class="pane-meta">文本可选</span>
                    </div>
                    <div class="pane-header-right">
                        <span class="pane-meta" id="selection-status">双向高亮已就绪</span>
                    </div>
                </div>
                <div class="preview-wrapper">
                    <div id="preview" class="preview markdown-body" tabindex="0"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- KaTeX JS -->
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js" integrity="sha384-XjKyOOlGwcjNTAIQHIpgOno0Hl1YQqzUOEleOLALmuqehneUG+vnGctmUb0ZY0l8" crossorigin="anonymous"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js" integrity="sha384-+VBxd3r6XgURycqtZ117nYw44OOcIax56Z4dCRWbxyPt0Koah1uHoK0o4+/RRE05" crossorigin="anonymous"></script>
    <!-- Highlight.js -->
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js" integrity="sha384-F/bZzf7p3Joyp5psL90p/p89AZJsndkSoGwRpXcZhleCWhd8SnRuoYo4d0yirjJp" crossorigin="anonymous"></script>
    <!-- Marked.js -->
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js" integrity="sha384-odPBjvtXVM/5hOYIr3A1dB+flh0c3wAT3bSesIOqEGmyUA4JoKf/YTWy0XKOYAY7" crossorigin="anonymous"></script>
    <!-- DOMPurify -->
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js" integrity="sha384-cwS6YdhLI7XS60eoDiC+egV0qHp8zI+Cms46R0nbn8JrmoAzV9uFL60etMZhAnSu" crossorigin="anonymous"></script>

    <script defer src="js/app.js"></script>
</body>
</html>
